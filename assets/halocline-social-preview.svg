<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Halocline: the engine that hides nothing</title>
  <desc id="d">The Halocline mark and wordmark above a water column split by one bright boundary: the halocline. Below the
boundary, a context ruler runs from short prompts to 262,144 tokens.</desc>
  <defs>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5d6e"/>
      <stop offset="0.65" stop-color="#0a4357"/>
      <stop offset="1" stop-color="#083548"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041d29"/>
      <stop offset="0.6" stop-color="#021019"/>
      <stop offset="1" stop-color="#01060a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff7e8" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#bafcf3" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f2fffd"/>
      <stop offset="0.88" stop-color="#bafcf3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7ff7e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mixed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff7e8" stop-opacity="0"/>
      <stop offset="1" stop-color="#9ff3ff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="markupper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5d6e"/><stop offset="1" stop-color="#083548"/>
    </linearGradient>
    <linearGradient id="marklower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041d29"/><stop offset="1" stop-color="#01060a"/>
    </linearGradient>
    <linearGradient id="markline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff7e8" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#f2fffd"/>
      <stop offset="1" stop-color="#7ff7e8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="caustic" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#a6f4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a6f4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam" cx="0.72" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#bafcf3" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#bafcf3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ff7e8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7ff7e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9ff3ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="upperClip"><rect x="0" y="0" width="1280" height="430"/></clipPath>
  </defs>

  <!-- water column -->
  <rect width="1280" height="640" fill="url(#lower)"/>
  <rect width="1280" height="430" fill="url(#upper)"/>
  <rect width="1280" height="430" fill="url(#caustic)"/>
  <rect width="1280" height="430" fill="url(#beam)"/>
  <g clip-path="url(#upperClip)">
    <rect width="1280" height="430" fill="url(#grid)"/>
    <rect y="360" width="1280" height="70" fill="url(#mixed)"/>
    <circle cx="1050" cy="96" r="1.8" fill="#d8fffa" opacity="0.55"/>
    <circle cx="1132" cy="196" r="1.4" fill="#d8fffa" opacity="0.45"/>
    <circle cx="962" cy="252" r="1.6" fill="#d8fffa" opacity="0.5"/>
    <circle cx="1206" cy="330" r="1.3" fill="#d8fffa" opacity="0.4"/>
    <circle cx="880" cy="386" r="1.5" fill="#d8fffa" opacity="0.55"/>
    <circle cx="1016" cy="404" r="1.2" fill="#d8fffa" opacity="0.5"/>
    <circle cx="1098" cy="374" r="1.7" fill="#d8fffa" opacity="0.45"/>
    <circle cx="760" cy="416" r="1.2" fill="#d8fffa" opacity="0.45"/>
    <circle cx="820" cy="128" r="1.1" fill="#d8fffa" opacity="0.35"/>
    <circle cx="1176" cy="62" r="1.2" fill="#d8fffa" opacity="0.4"/>
    <circle cx="1240" cy="240" r="1" fill="#d8fffa" opacity="0.3"/>
    <circle cx="700" cy="308" r="1" fill="#d8fffa" opacity="0.3"/>
  </g>

  <!-- the halocline -->
  <rect y="422" width="1280" height="26" fill="#9ff3ff" opacity="0.14" filter="url(#haze)"/>
  <rect x="0" y="429" width="1280" height="9" fill="#f2fffd" opacity="0.22" filter="url(#haze)"/>
  <path d="M0 430 C 180 427, 360 433, 560 430 S 900 428, 1080 431 S 1220 429, 1280 430" fill="none"
        stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
  <rect y="452" width="1280" height="150" fill="url(#pool)" opacity="0.5"/>
  <ellipse cx="640" cy="438" rx="420" ry="7" fill="#bafcf3" opacity="0.07" filter="url(#haze)"/>
  <circle cx="316" cy="470" r="1.2" fill="#bafcf3" opacity="0.2"/>
  <circle cx="842" cy="486" r="1" fill="#bafcf3" opacity="0.16"/>
  <circle cx="1122" cy="462" r="1.3" fill="#bafcf3" opacity="0.18"/>

  <!-- mark -->
  <g transform="translate(80 148)">
    <g transform="scale(1.75)">
      <clipPath id="markClip"><rect width="64" height="64" rx="14"/></clipPath>
      <g clip-path="url(#markClip)">
        <rect width="64" height="64" fill="url(#marklower)"/>
        <rect width="64" height="38" fill="url(#markupper)"/>
        <circle cx="20" cy="16" r="2" fill="#d8fffa" opacity="0.8"/>
        <circle cx="34" cy="25" r="1.6" fill="#d8fffa" opacity="0.7"/>
        <circle cx="46" cy="12" r="1.4" fill="#d8fffa" opacity="0.6"/>
        <path d="M0 38 C 16 36, 32 40, 48 38 S 60 37, 64 38" fill="none" stroke="url(#markline)" stroke-width="2.4"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="248" y="252" font-size="112" font-weight="600" letter-spacing="-3.6" fill="#effffc">halocline</text>
    <text x="252" y="304" font-size="30" font-weight="400" fill="#bafcf3">the engine that hides nothing</text>
    <text x="252" y="346" font-size="15" font-weight="500" letter-spacing="2.6" fill="#86c4cc">QWEN4 FAMILY · ONE RTX 4090 · SM_89 ONLY</text>
  </g>

  <!-- context ruler: 0 at x=80, 262,144 tokens at x=1200, to scale -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5f8f97">
    <text x="80" y="512" fill="#86c4cc" letter-spacing="1.4">context, to scale</text>
    <path d="M80 534 H1200" stroke="#86c4cc" stroke-opacity="0.22" stroke-width="1"/>
    <g stroke="#86c4cc" stroke-opacity="0.3" stroke-width="1">
      <path d="M80 528 V540"/><path d="M237 528 V540"/><path d="M678 528 V540"/><path d="M1200 528 V540"/>
    </g>
    <text x="80" y="566">short</text>
    <text x="237" y="566" text-anchor="middle">36K</text>
    <text x="678" y="566" text-anchor="middle">137K</text>
    <text x="1200" y="566" text-anchor="end" fill="#d8fffa">262,144</text>
    <text x="80" y="612" fill="#86c4cc">github.com/T-Crypt/halocline</text>
    <text x="1200" y="612" text-anchor="end" fill="#86c4cc">one engine · one card · every number measured</text>
  </g>
</svg>
