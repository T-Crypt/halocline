name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "evals/**"
      - "docs/**"
      - "SPECS.md"
      - "README.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the template engine
        # a venv: the runner's system python refuses `pip install --user` (PEP 668, externally managed)
        run: python3 -m venv .venv && .venv/bin/pip install jinja2==3.1.6
      - name: Test the site
        run: .venv/bin/python -m unittest discover -s site/tests
      - name: Build the site
        run: .venv/bin/python site/build.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
